name: 🐛 Bug report
description: Что-то не работает или работает не так как ожидалось
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Версия панели
      description: Видно в шапке /xkeen рядом с «v1.7.X»
      placeholder: v1.7.30
    validations:
      required: true
  - type: input
    id: keenetic
    attributes:
      label: Модель Keenetic + версия KeeneticOS
      description: Например KN-1810 (Hopper) + KeeneticOS 4.9-ndm-5
      placeholder: KN-1810 / KeeneticOS 4.x
  - type: input
    id: xkeen
    attributes:
      label: Версия XKeen
      description: На роутере `xkeen -v` покажет
      placeholder: 1.1.3.9 Stable
  - type: textarea
    id: what_happened
    attributes:
      label: Что произошло?
      description: Опиши проблему как видишь её
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидал увидеть?
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыл /xkeen
        2. Нажал кнопку X
        3. Получил ошибку Y
  - type: textarea
    id: logs
    attributes:
      label: Логи / скриншоты
      description: |
        Полезно:
        - Содержимое Output panel в дашборде после ошибочного действия
        - error.log с роутера: `ssh root@router 'tail -50 /opt/var/log/xray/error.log'`
        - watchdog.log: `ssh root@router 'tail -50 /opt/var/log/xray/watchdog.log'`
        - Скриншот UI
      render: text
